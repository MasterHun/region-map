<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>지역명 암기 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe9f0; }

  /* 지역 라벨 */
  .lbl { white-space: nowrap; pointer-events: none; transform: translate(-50%, -50%); position: absolute;
         font-weight: 700; color: #1d2733; letter-spacing: -0.02em;
         text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 5px #fff, 0 0 8px #fff; }
  .lbl.sido { font-family: 'Noto Serif KR', 'Apple Myungjo', 'Nanum Myeongjo', serif; font-size: 24px; font-weight: 600;
              letter-spacing: 0.06em; color: #1c2733; text-shadow: 0 0 2px #fff, 0 0 4px #fff, 0 0 8px rgba(255,255,255,.9); }
  .lbl.sgg  { font-size: 15px; color: #203a57; }
  .lbl.dong { font-size: 13px; font-weight: 600; color: #3a2a17; }
  .lbl.station { font-size: 11px; font-weight: 700; color: #0b5c9e; transform: translate(6px, -50%); text-shadow: none;
                 background: rgba(255,255,255,.92); border: 1px solid #9cc3e6; border-radius: 8px; padding: 0 5px; line-height: 15px; }
  .lbl .sub { display: block; font-size: 0.55em; font-weight: 500; color: #56606b; text-align: center; margin-top: 1px; }
  .lbl.dong .sub { font-size: 0.78em; color: #4a525b; }
  .dot { position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px; border-radius: 50%;
         background: #fff; border: 2.5px solid #0b5c9e; box-sizing: border-box; pointer-events: none; }
  .dot.xfer { width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 3px double #222; background: #fff; }
  .lbl.station { color: #222; border-color: #999; }
  .line-tip { font-weight: 700; font-size: 12px; padding: 2px 8px; }
  .leaflet-div-icon { background: none; border: none; }

  /* 패널 */
  .panel { position: absolute; z-index: 1000; top: 12px; left: 12px; background: rgba(255,255,255,.95);
           border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); padding: 12px 14px; max-width: 260px; }
  .phead { display: flex; align-items: center; gap: 6px; }
  .panel h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; }
  .phead button { font: inherit; font-size: 14px; width: 28px; height: 28px; border: 1px solid #c8d3dd; background: #fff; border-radius: 8px; cursor: pointer; padding: 0; line-height: 1; }
  .pbody { margin-top: 8px; }
  .panel.folded .pbody { display: none; }
  .panel.folded { padding: 8px 10px; }
  .panel.folded h1 span { display: none; }
  .level { font-size: 13px; color: #333; margin-bottom: 8px; }
  .level b { color: #0b5c9e; }
  .steps { display: flex; gap: 4px; margin-bottom: 10px; }
  .steps button { flex: 1; font: inherit; font-size: 12px; padding: 5px 0; border: 1px solid #c8d3dd; background: #fff; border-radius: 6px; cursor: pointer; }
  .steps button.on { background: #0b5c9e; color: #fff; border-color: #0b5c9e; }
  label.opt { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 4px 0; cursor: pointer; }
  .hint { font-size: 12px; color: #666; margin-top: 8px; line-height: 1.4; }
  .quizbox { position: absolute; z-index: 1000; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #14202c; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 16px;
             box-shadow: 0 2px 12px rgba(0,0,0,.3); text-align: center; }
  .quizbox small { display: block; font-size: 12px; color: #aebbc8; }
  #loading { position: absolute; z-index: 1001; top: 12px; right: 12px; background: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
  @media (max-width: 500px) { .panel { max-width: 230px; padding: 10px; } .hint { display: none; } }

  /* 다크모드 */
  html.dark { color-scheme: dark; }
  html.dark #map { background: #171c23; }
  html.dark .lbl { color: #f3f5f7; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 5px #000, 0 0 8px #000; }
  html.dark .lbl.sido { color: #f7f3ea; text-shadow: 0 0 2px #000, 0 0 4px #000, 0 0 8px rgba(0,0,0,.9); }
  html.dark .lbl.sgg { color: #dbe7f5; }
  html.dark .lbl.dong { color: #f4ead9; }
  html.dark .lbl .sub, html.dark .lbl.dong .sub { color: #c6cdd5; }
  html.dark .lbl.station { background: rgba(22,28,36,.94); color: #f2f2f2; }
  html.dark .dot { background: #171c23; }
  html.dark .dot.xfer { background: #171c23; border-color: #f0f0f0; }
  html.dark .panel { background: rgba(28,33,40,.95); color: #e8ecf0; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  html.dark .level { color: #ccd3da; }
  html.dark .level b { color: #6cb6ff; }
  html.dark .steps button, html.dark .phead button { background: #2a313a; color: #e8ecf0; border-color: #46505c; }
  html.dark .steps button.on { background: #3b82c4; border-color: #3b82c4; }
  html.dark .hint { color: #9aa4ae; }
  html.dark #loading { background: #2a313a; color: #eee; }
  html.dark .quizbox { background: #f5f7fa; color: #14202c; }
  html.dark .quizbox small { color: #4b5a68; }
  html.dark .leaflet-tooltip.line-tip { background: #2a313a; color: #eee; border-color: #2a313a; }
  html.dark .leaflet-tooltip-top.line-tip::before { border-top-color: #2a313a; }
  html.dark .leaflet-control-attribution { background: rgba(28,33,40,.8); color: #aaa; }
  html.dark .leaflet-control-attribution a { color: #8ab4f8; }
  html.dark .leaflet-bar a { background: #2a313a; color: #eee; border-color: #46505c; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <div class="phead">
    <h1>🗺️ <span>지역명 암기 지도</span></h1>
    <button id="btnTheme" title="다크/라이트 전환">🌙</button>
    <button id="btnFold" title="메뉴 접기/펼치기">▾</button>
  </div>
  <div class="pbody">
  <div class="level">지금 보이는 단계: <b id="lvName">시·도</b></div>
  <div class="steps">
    <button data-z="7">시·도</button>
    <button data-z="10">시·군·구</button>
    <button data-z="13">동</button>
  </div>
  <label class="opt"><input type="checkbox" id="optStation" checked> 지하철 노선·역 보기</label>
  <label class="opt" style="padding-left:18px"><input type="checkbox" id="optStationName"> 역 이름 보기</label>
  <label class="opt"><input type="checkbox" id="optParent" checked> 상위 지역 함께 보기</label>
  <label class="opt"><input type="checkbox" id="optQuiz"> 🙈 퀴즈 모드 (이름 숨기기)</label>
  <div class="hint">확대/축소하면 단계가 바뀌어요.<br>퀴즈 모드에서는 지역을 눌러 정답을 확인하세요.</div>
  </div>
</div>
<div id="loading" hidden>동 경계 불러오는 중…</div>
<div class="quizbox" id="quizbox" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// 줌 단계: 시도 ≤8, 시군구 9~11, 동 ≥12
const Z_SGG = 9, Z_DONG = 12, Z_STATION = Z_DONG, Z_STATION_NAME = Z_DONG;
const SIDO_COLORS = {
  '서울특별시':'#f4a7a7','부산광역시':'#a7c7f4','대구광역시':'#f4d0a7','인천광역시':'#b8e0c2','대전광역시':'#d8b8f0',
  '울산광역시':'#f0e0a0','세종특별자치시':'#a0e0e0','경기도':'#d9ecc4','강원특별자치도':'#c4dcec','충청북도':'#ecd9c4',
  '충청남도':'#e6c4ec','전북특별자치도':'#c4ecd9','전남광주통합특별시':'#ecc4cf','경상북도':'#e2e6b8','경상남도':'#b8d3e6',
  '제주특별자치도':'#f0c8a8'
};

const map = L.map('map', { zoomSnap: 0.5, minZoom: 6, maxZoom: 17, preferCanvas: true, zoomControl: false })
  .setView([36.2, 127.8], 7);
L.control.zoom({ position: 'bottomright' }).addTo(map); // 패널과 겹치지 않게 오른쪽 아래로
map.setMaxBounds([[32, 123], [39.5, 132.5]]);

// 글자 없는 배경 지도 (지명이 원래 지도에 안 보이도록) — 라이트/다크 테마별 색상
const THEME = {
  light: { tile: 'World_Light_Gray_Base', sido: '#4d6073', sgg: '#4a6278', dong: '#8a7a66' },
  dark:  { tile: 'World_Dark_Gray_Base',  sido: '#cfdbe7', sgg: '#a3b4c6', dong: '#b09e86' },
};
let isDark = false, baseTile = null;
function applyTheme(dark) {
  isDark = dark;
  document.documentElement.classList.toggle('dark', dark);
  document.getElementById('btnTheme').textContent = dark ? '☀️' : '🌙';
  const t = THEME[dark ? 'dark' : 'light'];
  if (baseTile) map.removeLayer(baseTile);
  baseTile = L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${t.tile}/MapServer/tile/{z}/{y}/{x}`, {
    maxNativeZoom: 12, maxZoom: 19,
    attribution: 'Tiles &copy; Esri | 역: OpenStreetMap | 행정경계: vuski/admdongkor (2026.07)'
  }).addTo(map);
  for (const k of ['sido', 'sgg', 'dong']) if (layers[k]) layers[k].setStyle({ color: t[k] });
}

const canvas = L.canvas({ padding: 0.3 });
const layers = {};
let labels = null, dongLoading = null;
const opt = { station: true, stationName: false, parent: true, quiz: false };

const DATA_VER = 3; // 데이터 파일을 바꾸면 올려서 브라우저 캐시를 갱신
const fetchJSON = u => fetch(u + '?v=' + DATA_VER).then(r => r.json());

Promise.all([fetchJSON('data/sido.json'), fetchJSON('data/sgg.json'), fetchJSON('data/labels.json'), fetchJSON('data/lines.json')])
.then(([sido, sgg, lb, lines]) => {
  labels = lb;
  // 지하철 노선 (공식 노선 색상)
  layers.lines = L.geoJSON(lines, { renderer: canvas, style: f => ({ color: f.properties.c, weight: 3, opacity: 0.9, lineCap: 'round' }),
    onEachFeature: (f, l) => l.bindTooltip(f.properties.n, { sticky: true, className: 'line-tip', direction: 'top', offset: [0, -6] })
  });
  layers.sido = L.geoJSON(sido, { renderer: canvas, style: f => ({
      color: '#34495e', weight: 1.6, fillColor: SIDO_COLORS[f.properties.n] || '#ddd', fillOpacity: 0.45 }),
    onEachFeature: (f, l) => l.on('click', () => reveal(f.properties.n, '', 'sido', l))
  }).addTo(map);
  layers.sgg = L.geoJSON(sgg, { renderer: canvas, style: { color: '#4a6278', weight: 1.2, fill: true, fillOpacity: 0 },
    onEachFeature: (f, l) => l.on('click', () => reveal(f.properties.n, f.properties.s, 'sgg', l))
  });
  applyTheme(isDark);
  update();
});

function ensureDong() {
  if (layers.dong || dongLoading) return;
  document.getElementById('loading').hidden = false;
  dongLoading = fetchJSON('data/dong.json').then(d => {
    layers.dong = L.geoJSON(d, { renderer: canvas, style: { color: THEME[isDark ? 'dark' : 'light'].dong, weight: 0.8, dashArray: '3 3', fill: true, fillOpacity: 0 },
      onEachFeature: (f, l) => l.on('click', () => reveal(f.properties.n, f.properties.s + ' ' + f.properties.g, 'dong', l))
    });
    document.getElementById('loading').hidden = true;
    update();
  });
}

// ---------- 라벨 레이어 (직접 그리기 + 겹침 제거) ----------
const LabelLayer = L.Layer.extend({
  onAdd(m) { this._el = L.DomUtil.create('div', 'leaflet-zoom-hide'); m.getPanes().markerPane.appendChild(this._el); },
  onRemove() { this._el.remove(); },
  render(html) { this._el.innerHTML = html; }
});
const labelLayer = new LabelLayer().addTo(map);

const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

function placeLabels(list, cls, fontPx, withSub, placed, bounds, maxCount) {
  // 넓은 지역부터 우선 배치 (겹치면 생략)
  const items = list.filter(d => bounds.contains([d[1], d[0]])).sort((a, b) => b[4] - a[4]);
  let html = '', n = 0;
  for (const d of items) {
    const p = map.latLngToLayerPoint([d[1], d[0]]);
    const subPx = fontPx * (cls === 'dong' ? 0.78 : 0.55);
    const w = Math.max(d[2].length * fontPx * 0.95, withSub ? d[3].length * subPx * 0.95 : 0) + 8, h = fontPx * (withSub ? (cls === 'dong' ? 2.2 : 1.9) : 1.3);
    const box = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];
    if (cls !== 'sido' && placed.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    placed.push(box);
    html += `<div class="lbl ${cls}" style="left:${p.x}px;top:${p.y}px">${esc(d[2])}` +
            (withSub ? `<span class="sub">${esc(d[3])}</span>` : '') + `</div>`;
    if (++n >= maxCount) break;
  }
  return html;
}

function placeStations(bounds, placed, showNames) {
  let html = '';
  for (const s of labels.station) {
    if (!bounds.contains([s[1], s[0]])) continue;
    const p = map.latLngToLayerPoint([s[1], s[0]]);
    const ls = s[3] || [], col = ls.length ? labels.lines[ls[0]] : '#888';
    html += ls.length > 1
      ? `<div class="dot xfer" style="left:${p.x}px;top:${p.y}px"></div>`
      : `<div class="dot" style="left:${p.x}px;top:${p.y}px;border-color:${col}"></div>`;
    if (!showNames) continue;
    const w = (s[2].length + 1) * 11.5 + 18, box = [p.x - 4, p.y - 10, p.x + w, p.y + 10];
    if (placed.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    placed.push(box);
    html += `<div class="lbl station" style="left:${p.x}px;top:${p.y}px;border-color:${ls.length > 1 ? '#222' : col}">${esc(s[2])}역</div>`;
  }
  return html;
}

function levelOf(z) { return z < Z_SGG ? 'sido' : z < Z_DONG ? 'sgg' : 'dong'; }

function update() {
  if (!labels) return;
  const z = map.getZoom(), lv = levelOf(z);
  document.getElementById('lvName').textContent = { sido: '시·도', sgg: '시·군·구', dong: '동(읍·면)' }[lv];
  document.querySelectorAll('.steps button').forEach(b => b.classList.toggle('on', levelOf(+b.dataset.z) === lv));

  // 경계선
  const want = { sgg: z >= Z_SGG, dong: z >= Z_DONG };
  if (want.dong) ensureDong();
  for (const k of ['sgg', 'dong']) {
    if (!layers[k]) continue;
    if (want[k] && !map.hasLayer(layers[k])) layers[k].addTo(map);
    if (!want[k] && map.hasLayer(layers[k])) map.removeLayer(layers[k]);
  }
  layers.sido.setStyle({ fillOpacity: lv === 'sido' ? 0.45 : lv === 'sgg' ? 0.25 : 0.12 });
  // 지하철 노선: 시군구 단계부터 가늘게, 동 단계에서 굵게
  const wantLines = opt.station && z >= Z_SGG;
  if (wantLines && !map.hasLayer(layers.lines)) layers.lines.addTo(map);
  if (!wantLines && map.hasLayer(layers.lines)) map.removeLayer(layers.lines);
  if (wantLines) layers.lines.setStyle({ weight: z < Z_DONG ? 2 : z < 14 ? 3.5 : 5, opacity: z < Z_DONG ? 0.65 : 0.9 });

  // 라벨
  const bounds = map.getBounds().pad(0.1), placed = [];
  let html = '';
  if (!opt.quiz) {
    if (lv === 'sido') html += placeLabels(labels.sido, 'sido', 22, false, placed, bounds, 99);
    if (lv === 'sgg')  html += placeLabels(labels.sgg, 'sgg', 15, opt.parent, placed, bounds, 400);
    if (lv === 'dong') html += placeLabels(labels.dong, 'dong', 13, opt.parent && z < 14, placed, bounds, 600);
  }
  labelLayer.render(html);
  // 역 이름은 퀴즈 모드에서도 위치 힌트로 보여줌 — 지역 라벨의 실제 크기를 재서 겹치지 않게 배치
  if (opt.station && z >= Z_STATION) {
    const real = [...labelLayer._el.children].map(e => {
      const x = parseFloat(e.style.left), y = parseFloat(e.style.top), w = e.offsetWidth / 2 + 3, h = e.offsetHeight / 2 + 2;
      return [x - w, y - h, x + w, y + h];
    });
    labelLayer.render(placeStations(bounds, real, opt.stationName && z >= Z_STATION_NAME) + html);
  }
}

map.on('zoomend moveend', update);

// ---------- 퀴즈 모드: 클릭하면 정답 ----------
let quizTimer, hiLayer;
function clearHi() { if (hiLayer) { hiLayer.setStyle(hiLayer._orig); hiLayer = null; } }
function reveal(name, parent, kind, layer) {
  if (!opt.quiz) return;
  const lv = levelOf(map.getZoom());
  if (kind !== lv) return; // 현재 단계의 지역만 응답
  clearHi();
  hiLayer = layer;
  layer._orig = { fillColor: layer.options.fillColor, fillOpacity: layer.options.fillOpacity, weight: layer.options.weight };
  layer.setStyle({ fillColor: '#ffd84d', fillOpacity: 0.55, weight: layer.options.weight + 1.5 });
  const box = document.getElementById('quizbox');
  box.innerHTML = `${esc(name)}${parent ? `<small>${esc(parent)}</small>` : ''}`;
  box.hidden = false;
  clearTimeout(quizTimer);
  quizTimer = setTimeout(() => { box.hidden = true; clearHi(); }, 5000);
}

// ---------- 테마 / 패널 접기 ----------
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const mq = matchMedia('(prefers-color-scheme: dark)');
applyTheme(store.get('theme') ? store.get('theme') === 'dark' : mq.matches);
mq.addEventListener('change', e => { if (!store.get('theme')) applyTheme(e.matches); });
document.getElementById('btnTheme').addEventListener('click', () => { applyTheme(!isDark); store.set('theme', isDark ? 'dark' : 'light'); });

const panel = document.getElementById('panel');
function setFold(f) { panel.classList.toggle('folded', f); document.getElementById('btnFold').textContent = f ? '▸' : '▾'; }
setFold(store.get('fold') ? store.get('fold') === '1' : innerWidth < 600); // 모바일은 기본 접힘
document.getElementById('btnFold').addEventListener('click', () => { setFold(!panel.classList.contains('folded')); store.set('fold', panel.classList.contains('folded') ? '1' : '0'); });

// ---------- 컨트롤 ----------
document.querySelectorAll('.steps button').forEach(b =>
  b.addEventListener('click', () => map.setZoom(+b.dataset.z)));
document.getElementById('optStation').addEventListener('change', e => { opt.station = e.target.checked; update(); });
document.getElementById('optStationName').addEventListener('change', e => { opt.stationName = e.target.checked; update(); });
document.getElementById('optParent').addEventListener('change', e => { opt.parent = e.target.checked; update(); });
document.getElementById('optQuiz').addEventListener('change', e => {
  opt.quiz = e.target.checked;
  if (!opt.quiz) { document.getElementById('quizbox').hidden = true; clearHi(); }
  update();
});
</script>
</body>
</html>
